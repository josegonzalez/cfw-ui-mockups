<!DOCTYPE html>
<!--
PORTING NOTES
CFW: Vitro Launcher (Love2D launcher for muOS)   Device: rg35xx (640x480)
Source: github.com/KevDoy/VitroLauncher-muOS
Mode: reproduce (static reference - Settings screen at rest over the animated background)

This is a single-screen snapshot for handoff. The interactive build with L1/R1 screen
switching and all transitions is rg35xx/launcher.html. Full metrics: ../reference/source-notes.md.
Lands on Black & Blue waves; foreground white; Roboto Condensed. Focus border white.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vitro Launcher - Settings (rg35xx 640x480)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../shared/device-frame.css" />
  <link rel="stylesheet" href="../vitro.css" />
  <style> body { background: #0c0d12; } </style>
</head>
<body class="min-h-screen grid place-items-center p-10">
  <div class="device-viewport" style="--screen-w:640; --screen-h:480; --scale:1.3;">
    <div class="device">
      <div class="device__screen">
        <div class="screen">
          <div class="vitro"></div>
        </div>
      </div>
      <div class="device__controls">
        <div class="device__shoulders">
          <div class="shoulder" data-btn="l">L1</div>
          <div class="shoulder" data-btn="r">R1</div>
        </div>
        <div class="dpad">
          <div class="dpad__btn" data-btn="up"></div>
          <div class="dpad__btn" data-btn="down"></div>
          <div class="dpad__btn" data-btn="left"></div>
          <div class="dpad__btn" data-btn="right"></div>
          <div class="dpad__center"></div>
        </div>
        <div class="device__meta">
          <div class="pill" data-btn="select">SELECT</div>
          <div class="pill" data-btn="start">START</div>
        </div>
        <div class="faces">
          <div class="face" data-btn="x">X</div>
          <div class="face" data-btn="y">Y</div>
          <div class="face" data-btn="a">A</div>
          <div class="face" data-btn="b">B</div>
        </div>
      </div>
    </div>
  </div>
  <script src="../screens.js"></script>
  <script src="../backgrounds.js"></script>
  <script src="../vitro.js"></script>
  <script>
    Vitro.boot(document.querySelector('.vitro'), { w: 640, h: 480, screen: 'settings', interactive: false });
  </script>
</body>
</html>
