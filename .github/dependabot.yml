# Every dependency ecosystem in the repo: the app's npm packages and the workflows' actions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      # Dev tooling moves together - Vite, Vitest, Playwright, ESLint, TypeScript, Storybook - so
      # one grouped PR per week rather than a dozen that each rebuild the baselines.
      development:
        dependency-type: development
      production:
        dependency-type: production
    ignore:
      # typescript-eslint caps its peer at <6.1.0, so a TypeScript major fails `npm ci` with
      # ERESOLVE. Drop this once typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
