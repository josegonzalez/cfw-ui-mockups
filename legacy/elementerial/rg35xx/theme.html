<!DOCTYPE html>
<!--
PORTING NOTES
CFW: Elementerial (EmulationStation theme)   Device: rg35xx (640x480)
Source: github.com/mluizvitor/es-theme-elementerial @ e710525 - theme.xml, variables.xml,
  settings/colors/scheme.xml, settings/colors/<scheme>/scheme-{dark,light}.xml,
  settings/display/view-{general,system,boxes,menu}.xml,
  settings/display/view-grid/*.xml, settings/display/view-elementflix/*.xml,
  settings/display/aspect/4-3.xml, settings/display/{statusbar,background}/*.xml,
  settings/fontSize/medium.xml
  Motion additionally read from batocera-emulationstation SystemView.cpp and
  CarouselComponent.cpp. Full extracted spec: ../reference/source-notes.md
Mode: reproduce (interactive - eight views, 28 colour combinations, every subset)

Layout:
  - Every coordinate in the source is normalized 0-1 (x to width, y to height) with an
    origin anchor; layout.js keeps those numbers and resolves them to literal px once for
    640x480. Nothing reflows with the window.
  - Aspect 4:3, so the theme's ratio43 asset set applies at 1:1 with no resampling.
  - System: carousel 704x480 at left -32, pitch 176, logo 160x120; selected cell top-left (73.6, 288), scaled 1.4 about its centre.
  - Gamelist: artwork band under a bgColor scrim, title at 0.1 of height, list from 0.2.
    Row pitch 34.16px (video 28.90px) - 10 rows and 7 rows respectively.
  - Grid 3x2 of 170.7x156; boxes 2x2 of 269.3x154, selected tile zoomed 1.075;
    elementflix 3x1 of 178.5x199.2 with bgColor edge fades.
  - Menu panel geometry is an APPROXIMATION: view-menu.xml themes only fonts, colours,
    the panel background, the button/switch art and the icon set - the panel's position
    and size belong to ES's MenuComponent, not the theme.
  - Help bar bottom-left at 0.96 of height; clock and battery top-right over a black scrim;
    borders.png rounds the screen corners at zIndex 100.
Colors:
  - Five tokens per scheme - fgColor, mainColor, onMainColor, bgColor, sectColor - across
    14 schemes x dark/light. Applied as CSS custom properties on .el-root, so switching is
    one style recalc. Alpha is the source's 2-hex suffix convention (${fgColor}${percent.90}).
  - Deliberately scheme-independent, per the source: the boxes caption is white on 000000CC
    and the clock and battery are always FFFFFF.
  - The only place dark.xml and light.xml genuinely differ is the elementflix selected tile,
    which is flat FFFFFF in dark and mainColor in light.
Typography:
  - Inter Regular/Bold/Light for everything, Roboto Condensed for the help bar only.
  - Medium size set: H1 28.8px, H2 24px, body 16.8px, caption 13.5px.
  - lineSpacing multiplies the font's line height (Inter 1.2102 em), not the font size.
Focus & selection:
  - System: horizontal carousel, no wrap at the ends (scrollLoop false).
  - Basic, detailed and video: vertical list, full-width mainColor selector bar with
    onMainColor text; the bar spans the list width and is not inset by horizontalMargin.
  - Grid, boxes and elementflix: imagegrid laid out along its scroll axis - column-major
    when horizontal, row-major when elementflix is set to vertical.
Buttons (keys / on-screen frame):
  - A (Z) navigation bar in the system view, back in gamelists.
  - B (X) enter the gamelist from the system view, launch from a gamelist.
  - Y (S) search/random.   X (A) netplay.   Start (Enter) opens the menu.
  - Select (RShift) options.   L/R (Q/W) page the list or grid.   D-pad moves the cursor.
  - Mockup only, deliberately outside the device key map: [ ] view, , . scheme,
    \ dark/light, - = font size. Every other subset is on the chrome strip below.
Transitions (read from batocera-emulationstation, not inferred):
  - defaultTransition fade governs the EXTRAS, not the carousel. On a system change the
    logo row slides one pitch on easeOutQuint over 500ms while the previous artwork and
    systemName fade out on top of the incoming ones (SystemView.cpp:770-794).
  - Logo scale and opacity are continuous functions of the fractional camera distance, so
    cards grow 1 to 1.4 and brighten from minLogoOpacity 0.5 to 1 as they reach focus
    (CarouselComponent.cpp:502-511).
  - systemInfo is not an extra: it fades out over 150ms, swaps its text once out, then
    fades in over 300ms starting at systemInfoDelay (SystemView.cpp:692-744).
  - System artwork re-runs its 1000ms easeOut storyboard on every system change; the
    optional carousel video waits 1.5s then fades in over 1000ms.
  - Grid and boxes selection settles over 250ms; view switching cross-fades over 200ms.
Notes:
  - The README screenshots are from May 2023 and the per-aspect layout files are from July
    2025, so they disagree on gamelist row pitch, the gamelist backdrop treatment and the
    system cover anchor. This follows the source; ../reference/source-notes.md lists every
    divergence.
  - Help-bar strings and glyphs come from EmulationStation, not the theme. They are
    transcribed from the reference screenshots and the glyphs are drawn approximations.
  - The theme ships no per-game artwork or videos, so screenshots and marquees are
    generated SVG stand-ins, and thumbnail/marquee grid modes reuse them. System logos,
    backdrops and the per-scheme no-artwork placeholders are the real assets.
  - Background style "custom" reads customBackground/, which no fresh install ships, so it
    falls back to the system backdrop exactly as the real theme would.
  - The 1:1 aspect has no osd-bg.png of its own and borrows the 4:3 one, stretched. That is
    reproduced rather than fixed.
  - The frame's 8px screen radius is turned off so borders.png owns the corners.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elementerial - RG35XX (640x480)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../shared/device-frame.css" />
  <link rel="stylesheet" href="../elementerial.css" />
  <link rel="stylesheet" href="../masks.css" />
  <style> body { background: #0c0d12; } </style>
</head>
<body class="min-h-screen grid place-items-center p-10">
  <div class="device-viewport" style="--screen-w:640; --screen-h:480; --scale:1.3;">
    <div class="device">
      <div class="device__screen">
        <div class="screen">
          <div class="el-root"></div>
        </div>
      </div>
        <div class="device__controls">
          <div class="device__shoulders">
            <div class="shoulder" data-btn="l">L</div>
            <div class="shoulder" data-btn="r">R</div>
          </div>
          <div class="dpad">
            <div class="dpad__btn" data-btn="up"></div>
            <div class="dpad__btn" data-btn="down"></div>
            <div class="dpad__btn" data-btn="left"></div>
            <div class="dpad__btn" data-btn="right"></div>
            <div class="dpad__center"></div>
          </div>
          <div class="device__meta">
            <div class="pill" data-btn="select">SELECT</div>
            <div class="pill" data-btn="start">START</div>
          </div>
          <div class="faces">
            <div class="face" data-btn="x">X</div>
            <div class="face" data-btn="y">Y</div>
            <div class="face" data-btn="a">A</div>
            <div class="face" data-btn="b">B</div>
          </div>
        </div>
    </div>
  </div>

  <script src="../palette.js"></script>
  <script src="../layout.js"></script>
  <script src="../views.js"></script>
  <script src="../elementerial.js"></script>
  <script>
    Elementerial.boot(document.querySelector('.el-root'), {
      device: 'rg35xx', view: 'system', scheme: 'strawberry', style: 'dark',
      fontSize: 'medium', system: 'gba', interactive: true
    });
  </script>
</body>
</html>
