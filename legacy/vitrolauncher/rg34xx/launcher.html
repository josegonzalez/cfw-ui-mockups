<!DOCTYPE html>
<!--
PORTING NOTES
CFW: Vitro Launcher (Love2D launcher for muOS)   Device: rg34xx (720x480)
Source: github.com/KevDoy/VitroLauncher-muOS - main.lua, src/ui/{carousel,grid,settings,navpill,wave,particles,clouds,simple,glass,statusbar}.lua
Mode: reproduce (interactive - all three screens + transitions in one page)

Layout:
  - Identical to the RG35XX build; only the screen is 720 wide (s still = 1 at 480 tall), so
    horizontally-centered elements (carousel, grid, nav/status pills) sit with wider margins.
  - Full metrics in ../reference/source-notes.md.
Colors / Typography / Focus / Buttons / Transitions:
  - Same as rg35xx/launcher.html (see that file's notes). Lands on Black & Blue waves.
Notes:
  - VitroLauncher targets 640x480 and 720x480; this is the 720x480 variant (RG34XX 3:2 panel).
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vitro Launcher - RG34XX (720x480)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../shared/device-frame.css" />
  <link rel="stylesheet" href="../vitro.css" />
  <style> body { background: #0c0d12; } </style>
</head>
<body class="min-h-screen grid place-items-center p-10">
  <div class="device-viewport" style="--screen-w:720; --screen-h:480; --scale:1.15;">
    <div class="device">
      <div class="device__screen">
        <div class="screen">
          <div class="vitro"></div>
        </div>
      </div>

      <div class="device__controls">
        <div class="device__shoulders">
          <div class="shoulder" data-btn="l">L1</div>
          <div class="shoulder" data-btn="r">R1</div>
        </div>
        <div class="dpad">
          <div class="dpad__btn" data-btn="up"></div>
          <div class="dpad__btn" data-btn="down"></div>
          <div class="dpad__btn" data-btn="left"></div>
          <div class="dpad__btn" data-btn="right"></div>
          <div class="dpad__center"></div>
        </div>
        <div class="device__meta">
          <div class="pill" data-btn="select">SELECT</div>
          <div class="pill" data-btn="start">START</div>
        </div>
        <div class="faces">
          <div class="face" data-btn="x">X</div>
          <div class="face" data-btn="y">Y</div>
          <div class="face" data-btn="a">A</div>
          <div class="face" data-btn="b">B</div>
        </div>
      </div>
    </div>
  </div>

  <script src="../screens.js"></script>
  <script src="../backgrounds.js"></script>
  <script src="../vitro.js"></script>
  <script>
    Vitro.boot(document.querySelector('.vitro'), { w: 720, h: 480, screen: 'recent', interactive: true });
  </script>
</body>
</html>
