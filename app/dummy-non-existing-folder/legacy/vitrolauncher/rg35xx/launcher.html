<!DOCTYPE html>
<!--
PORTING NOTES
CFW: Vitro Launcher (Love2D launcher for muOS)   Device: rg35xx (640x480)
Source: github.com/KevDoy/VitroLauncher-muOS - main.lua, src/ui/{carousel,grid,settings,navpill,wave,particles,clouds,simple,glass,statusbar}.lua
Mode: reproduce (interactive - all three screens + transitions in one page)

Layout:
  - Persistent animated background (waves default), readability wash, top-right status
    pill (clock + battery), bottom glass nav pill (Last Played / All Titles / Settings).
  - Three screens swapped in place with L1/R1: carousel, paged grid, settings list.
    Full metrics in ../reference/source-notes.md (everything at s=1 since height is 480).
Colors:
  - Lands on Black & Blue: bg #0e141b, accent #1a9fff. FG white; #1F242E on white-blue.
  - Focus border white (accent on light/simple schemes). Readability wash black 0.25.
Typography:
  - Roboto Condensed Bold/Regular. Settings title 30, labels 19, values 15; carousel/grid
    title 21, playtime 15; status 16.
Focus & selection:
  - Carousel: focused tile grows 1.25x, white 4px border, playtime fades in. Grid: 1.14x zoom.
    Settings: focused row gets a glass pill. Exponential ease-out (~300ms), no overshoot.
Buttons (keys / on-screen frame):
  - L1/R1 (Q/W) switch screens; D-pad scroll; A (Z) launch; X (A key) grid skip-page;
    Y (S key) grid bookmark; SELECT (Right Shift) toggle Settings; B (X key) leave Settings;
    hold Menu (Esc) power-off; L1+X+START (Q+A+Enter) exit combo.
Transitions:
  - Startup fade (black->bg 600ms, UI 450ms); screen swap instant + nav bubble slide 250ms;
    autohide 350ms linear; power-off 2s linear; exit combo 2s bar; game-launch loading fade.
Notes:
  - Settings Color/Theme rows live-switch the background across all 5 themes and every accent,
    exactly like the app. Cover art is stylized SVG placeholder (no real art in source).
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vitro Launcher - RG35XX (640x480)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../shared/device-frame.css" />
  <link rel="stylesheet" href="../vitro.css" />
  <style> body { background: #0c0d12; } </style>
</head>
<body class="min-h-screen grid place-items-center p-10">
  <div class="device-viewport" style="--screen-w:640; --screen-h:480; --scale:1.3;">
    <div class="device">
      <div class="device__screen">
        <div class="screen">
          <div class="vitro"></div>
        </div>
      </div>

      <div class="device__controls">
        <div class="device__shoulders">
          <div class="shoulder" data-btn="l">L1</div>
          <div class="shoulder" data-btn="r">R1</div>
        </div>
        <div class="dpad">
          <div class="dpad__btn" data-btn="up"></div>
          <div class="dpad__btn" data-btn="down"></div>
          <div class="dpad__btn" data-btn="left"></div>
          <div class="dpad__btn" data-btn="right"></div>
          <div class="dpad__center"></div>
        </div>
        <div class="device__meta">
          <div class="pill" data-btn="select">SELECT</div>
          <div class="pill" data-btn="start">START</div>
        </div>
        <div class="faces">
          <div class="face" data-btn="x">X</div>
          <div class="face" data-btn="y">Y</div>
          <div class="face" data-btn="a">A</div>
          <div class="face" data-btn="b">B</div>
        </div>
      </div>
    </div>
  </div>

  <script src="../screens.js"></script>
  <script src="../backgrounds.js"></script>
  <script src="../vitro.js"></script>
  <script>
    Vitro.boot(document.querySelector('.vitro'), { w: 640, h: 480, screen: 'recent', interactive: true });
  </script>
</body>
</html>
