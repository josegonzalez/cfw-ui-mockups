<!DOCTYPE html>
<!--
PORTING NOTES
CFW: PlayStation X (theme for the Batocera EmulationStation fork)   Device: rg552 (1920x1152)
Source: github.com/pajarorrojo/es-theme-PlayStation-X @ 26ce759 (v43.1) - splash.xml (a separate theme root, not a view of theme.xml)
Mode: reproduce (static reference - Boot splash at rest)

This is a single-screen snapshot for handoff, produced by the interactive build with
interactive:false - which routes every storyboard through settle() instead of play(), so it
renders at rest with zero live animations. The interactive page with all 11 views, the live
subset toggles and every transition is rg552/theme.html.

Device maps to the theme's own aspect-ratio subset "5-3" (5:3).
Full metrics, palette, fonts, the storyboard format and the pinned-subset list:
../reference/source-notes.md.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PlayStation X - Boot splash (rg552 1920x1152)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../shared/device-frame.css" />
  <link rel="stylesheet" href="../playstation-x.css" />
  <style> body { background: #0c0d12; } </style>
</head>
<body class="min-h-screen grid place-items-center p-10">
  <div class="device-viewport" style="--screen-w:1920; --screen-h:1152; --scale:0.62;">
    <div class="device">
      <div class="device__screen">
        <div class="screen">
          <div class="psx-root"></div>
        </div>
      </div>
      <div class="device__controls">
        <div class="device__shoulders">
          <div class="shoulder" data-btn="l">L</div>
          <div class="shoulder" data-btn="r">R</div>
        </div>
        <div class="dpad">
          <div class="dpad__btn" data-btn="up"></div>
          <div class="dpad__btn" data-btn="down"></div>
          <div class="dpad__btn" data-btn="left"></div>
          <div class="dpad__btn" data-btn="right"></div>
          <div class="dpad__center"></div>
        </div>
        <div class="device__meta">
          <div class="pill" data-btn="select">SELECT</div>
          <div class="pill" data-btn="start">START</div>
        </div>
        <div class="faces">
          <div class="face" data-btn="x">X</div>
          <div class="face" data-btn="y">Y</div>
          <div class="face" data-btn="a">A</div>
          <div class="face" data-btn="b">B</div>
        </div>
      </div>
    </div>
  </div>

  <script src="../storyboard.js"></script>
  <script src="../storyboards.js"></script>
  <script src="../palette.js"></script>
  <script src="../layout.js"></script>
  <script src="../views.js"></script>
  <script src="../playstation-x.js"></script>
  <script>
    PlayStationX.boot(document.querySelector('.psx-root'), {
      device: 'rg552', view: 'splash', colorset: 'blue', secondary: 'default',
      carouselType: 'PS4', carouselSize: 'medium', topInfo: 'default', system: 'psx',
      interactive: false
    });
  </script>
</body>
</html>
